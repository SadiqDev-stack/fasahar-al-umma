<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#176b4d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Sauke a iPhone — Fasahar Al'umma</title>
  <meta name="description" content="Yadda za ka sauke Fasahar Al'umma a wayar iPhone ta Safari." />

  <link rel="manifest" href="/manifest.json" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <link rel="stylesheet" href="/css/style.css" />

  <style>
    .ios-page {
      padding: 24px 0 100px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .ios-page.visible { opacity: 1; }

    /* ---- Top bar ---- */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }
    .back-btn {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--dark);
      display: grid;
      place-items: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: all 0.2s;
      text-decoration: none;
    }
    .back-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .top-bar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ---- Hero ---- */
    .ios-hero {
      text-align: center;
      margin-bottom: 34px;
    }
    .ios-hero-icon {
      width: 84px; height: 84px;
      border-radius: 22px;
      background: linear-gradient(135deg, #17231e 0%, #0d1512 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 38px;
      margin: 0 auto 20px;
      box-shadow: 0 16px 40px rgba(20, 50, 38, 0.22);
    }
    .ios-hero h1 {
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 800;
      letter-spacing: -1.1px;
      line-height: 1.15;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .ios-hero p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.65;
      max-width: 460px;
      margin: 0 auto;
    }

    /* ---- Video card ---- */
    .ios-video {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: 0 10px 30px rgba(20, 50, 38, 0.06);
    }
    .ios-video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #17231e;
    }
    .ios-video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .ios-video-caption {
      padding: 14px 18px;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ios-video-caption i {
      color: var(--primary);
      font-size: 14px;
      flex-shrink: 0;
    }

    /* ---- Steps ---- */
    .ios-steps-head {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 14px;
      padding-left: 4px;
    }

    .ios-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .ios-step {
      display: flex;
      gap: 16px;
      padding: 18px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all 0.2s;
    }
    .ios-step:hover {
      border-color: var(--primary);
    }

    .ios-step-num {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(23, 107, 77, 0.24);
    }

    .ios-step-body { flex: 1; min-width: 0; }
    .ios-step-body h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 5px;
      letter-spacing: -0.2px;
    }
    .ios-step-body p {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }
    .ios-step-body strong {
      color: var(--dark);
      font-weight: 700;
    }
    .ios-step-body .safari-icon {
      display: inline-block;
      color: var(--primary);
      font-size: 14px;
      margin: 0 3px;
      vertical-align: middle;
    }

    /* ---- Callout ---- */
    .ios-callout {
      display: flex;
      gap: 12px;
      padding: 16px 18px;
      background: #fdf3dd;
      border: 1px solid #f0e0b8;
      border-radius: 14px;
      font-size: 13px;
      color: var(--dark);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .ios-callout i {
      color: var(--accent-dark);
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .ios-callout strong {
      color: var(--accent-dark);
      font-weight: 800;
    }

    /* ---- CTA ---- */
    .ios-cta {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ios-btn {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .ios-btn:active { transform: scale(0.98); }
    .ios-btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 24px rgba(23, 107, 77, 0.28);
    }
    .ios-btn-primary:hover { background: var(--primary-dark); }
    .ios-btn-secondary {
      background: var(--white);
      color: var(--dark);
      border: 1.5px solid var(--border);
    }
    .ios-btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    @media (min-width: 901px) {
      body { padding-bottom: 0; }
      .ios-page {
        max-width: 720px;
        padding-top: 60px;
        padding-bottom: 60px;
      }
      .ios-cta { flex-direction: row; }
      .ios-cta .ios-btn { flex: 1; }
    }
  </style>
</head>

<body>

  <main class="container ios-page" id="iosPage">
    <div id="contentMount"></div>
  </main>

  <div id="tabbar"></div>

  <script src="/data.js"></script>
  <script src="/storage.js"></script>
  <script src="/app.js"></script>

  <script>
    (function initIosDownload() {
      const lang = STORAGE.getLanguage();
      const isHa = lang === "ha";
      const page = document.getElementById("iosPage");
      const mount = document.getElementById("contentMount");

      document.title = (isHa ? "Sauke a iPhone" : "Download on iPhone") + " — Fasahar Al'umma";

      /* ---------- Video URL — REPLACE with your own tutorial ---------- */
      /* Search YouTube for "how to install PWA on iPhone Safari" and embed it */
      const TUTORIAL_VIDEO = "";   // e.g. "https://www.youtube.com/embed/VIDEO_ID"

      const headHtml = `
        <div class="top-bar">
          <a href="/about.html" class="back-btn" aria-label="${isHa ? "Koma" : "Back"}">
            <i class="fa-solid fa-chevron-left"></i>
          </a>
          <div class="top-bar-title">${isHa ? "Sauke a iPhone" : "Download on iPhone"}</div>
        </div>
      `;

      const heroHtml = `
        <div class="ios-hero">
          <div class="ios-hero-icon"><i class="fa-brands fa-apple"></i></div>
          <h1>${isHa
            ? "Yadda za ka sauke a iPhone"
            : "How to download on iPhone"}</h1>
          <p>${isHa
            ? "Ba sai ka je App Store ba. Za ka iya amfani da Fasahar Al'umma a iPhone ɗinka kamar manhaja ta gaske — kai tsaye daga Safari."
            : "No need to visit the App Store. You can use Fasahar Al'umma on your iPhone like a real app — straight from Safari."}</p>
        </div>
      `;

      const videoHtml = TUTORIAL_VIDEO ? `
        <div class="ios-video">
          <div class="ios-video-frame">
            <iframe
              src="${TUTORIAL_VIDEO}"
              title="${isHa ? "Bidiyon koyarwa" : "Tutorial video"}"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
          <div class="ios-video-caption">
            <i class="fa-solid fa-circle-play"></i>
            <span>${isHa
              ? "Kalli bidiyon don ganin yadda ake yi mataki-mataki."
              : "Watch the video to see the steps step-by-step."}</span>
          </div>
        </div>
      ` : "";

      const stepsHeadHtml = `
        <div class="ios-steps-head">
          ${isHa ? "Matakai 4" : "4 Steps"}
        </div>
      `;

      const safariIcon = `<i class="fa-brands fa-safari safari-icon"></i>`;
      const shareIcon = `<i class="fa-solid fa-arrow-up-from-bracket safari-icon"></i>`;
      const plusIcon = `<i class="fa-solid fa-square-plus safari-icon"></i>`;

      const stepsHtml = `
        <div class="ios-steps">
          <div class="ios-step">
            <div class="ios-step-num">1</div>
            <div class="ios-step-body">
              <h3>${isHa ? "Buɗe Safari" : "Open Safari"}</h3>
              <p>${isHa
                ? `Dole ne ka yi amfani da ${safariIcon} <strong>Safari</strong>. Ba zai yi aiki da Chrome ko Firefox a iPhone ba.`
                : `You must use ${safariIcon} <strong>Safari</strong>. Chrome or Firefox on iPhone won't work.`}</p>
            </div>
          </div>

          <div class="ios-step">
            <div class="ios-step-num">2</div>
            <div class="ios-step-body">
              <h3>${isHa ? "Je wannan shafin" : "Visit this site"}</h3>
              <p>${isHa
                ? "Rubuta adireshin Fasahar Al'umma a Safari: <strong>fasaharalumma.app</strong>"
                : "Type the Fasahar Al'umma address in Safari: <strong>fasaharalumma.app</strong>"}</p>
            </div>
          </div>

          <div class="ios-step">
            <div class="ios-step-num">3</div>
            <div class="ios-step-body">
              <h3>${isHa ? "Danna maɓallin Share" : "Tap the Share button"}</h3>
              <p>${isHa
                ? `A ƙasan allo, danna ${shareIcon} <strong>Share</strong> — akwatin da ke da kibiya ta fita.`
                : `At the bottom of the screen, tap ${shareIcon} <strong>Share</strong> — the box with an arrow going up.`}</p>
            </div>
          </div>

          <div class="ios-step">
            <div class="ios-step-num">4</div>
            <div class="ios-step-body">
              <h3>${isHa ? "Zaɓi \"Add to Home Screen\"" : "Choose \"Add to Home Screen\""}</h3>
              <p>${isHa
                ? `Zazzage ƙasa, ka nemo ${plusIcon} <strong>Add to Home Screen</strong>. Danna shi, sannan danna <strong>Add</strong>.`
                : `Scroll down, find ${plusIcon} <strong>Add to Home Screen</strong>. Tap it, then tap <strong>Add</strong>.`}</p>
            </div>
          </div>
        </div>
      `;

      const calloutHtml = `
        <div class="ios-callout">
          <i class="fa-solid fa-circle-check"></i>
          <div>${isHa
            ? "<strong>Madalla!</strong> Yanzu Fasahar Al'umma na kan allo na gidanka. Za ka iya buɗe ta kowane lokaci — ko ba ka da intanet."
            : "<strong>Done!</strong> Fasahar Al'umma is now on your home screen. Open it anytime — even without internet."}</div>
        </div>
      `;

      const ctaHtml = `
        <div class="ios-cta">
          <a href="/home.html" class="ios-btn ios-btn-primary">
            <i class="fa-solid fa-play"></i>
            ${isHa ? "Fara Koyo" : "Start Learning"}
          </a>
          <a href="/about.html" class="ios-btn ios-btn-secondary">
            <i class="fa-solid fa-chevron-left"></i>
            ${isHa ? "Koma" : "Back"}
          </a>
        </div>
      `;

      mount.innerHTML = headHtml + heroHtml + videoHtml + stepsHeadHtml + stepsHtml + calloutHtml + ctaHtml;
      requestAnimationFrame(() => page.classList.add("visible"));
    })();
  </script>

</body>
</html>
