<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#176b4d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>Darasi — Fasahar Al'umma</title>
  <meta name="description" content="Koyi darussan fasahar zamani a Hausa da Turanci." />

  <link rel="manifest" href="/manifest.json" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <link rel="stylesheet" href="/css/style.css" />

  <style>
    /* ============================================================
       MODULE PAGE
       ============================================================ */
    .module-page {
      padding: 20px 0 100px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .module-page.visible { opacity: 1; }

    /* ---- Top bar with back button + module icon ---- */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--dark);
      display: grid;
      place-items: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: all 0.2s;
      cursor: pointer;
      text-decoration: none;
    }

    .back-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .top-bar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ---- Module hero ---- */
    .module-hero {
      background: linear-gradient(135deg, #eef7f2 0%, #e0f0e7 100%);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .module-hero-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 26px;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(23, 107, 77, 0.28);
    }

    .module-hero-body { flex: 1; min-width: 0; }

    .module-hero-title {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--dark);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .module-hero-sub {
      font-size: 13px;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .module-hero-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }

    /* ---- Progress bar in hero ---- */
    .module-hero-progress {
      margin-top: 16px;
    }

    .module-hero-progress .bar {
      height: 6px;
      background: rgba(23, 107, 77, 0.15);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .module-hero-progress .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: inherit;
      transition: width 0.6s ease;
    }

    .module-hero-progress .bar-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
    }

    /* ---- Section title ---- */
    .lessons-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .lessons-head h3 {
      font-size: 16px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.3px;
    }

    .lessons-head span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    /* ---- Lesson list ---- */
    .lessons-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .lesson-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .lesson-row:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(23, 107, 77, 0.1);
    }

    .lesson-row:active { transform: scale(0.99); }

    /* ---- Lesson number / status circle ---- */
    .lesson-num {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    /* States */
    .lesson-row.unlocked .lesson-num {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(23, 107, 77, 0.25);
    }

    .lesson-row.completed .lesson-num {
      background: var(--primary-dark);
      color: #fff;
    }

    .lesson-row.locked .lesson-num {
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
    }

    .lesson-row.locked {
      opacity: 0.72;
      cursor: not-allowed;
      pointer-events: none;
    }

    .lesson-row.locked:hover {
      border-color: var(--border);
      transform: none;
      box-shadow: none;
    }

    /* ---- Lesson body ---- */
    .lesson-body { flex: 1; min-width: 0; }

    .lesson-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .lesson-row.locked .lesson-title {
      color: var(--muted);
    }

    .lesson-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .lesson-row.completed .lesson-sub {
      color: var(--primary);
    }

    /* ---- Right status icon ---- */
    .lesson-status {
      flex-shrink: 0;
      font-size: 18px;
      color: var(--muted);
    }

    .lesson-row.completed .lesson-status { color: var(--primary); }
    .lesson-row.unlocked .lesson-status { color: var(--primary); }
    .lesson-row.locked .lesson-status { color: var(--muted); }

    /* ---- Exam CTA ---- */
    .exam-card {
      background: linear-gradient(135deg, #176b4d 0%, #0f4d38 100%);
      border-radius: var(--radius);
      padding: 24px;
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .exam-card::before {
      content: "";
      position: absolute;
      top: -40%; right: -20%;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(231,168,59,0.18), transparent 70%);
      pointer-events: none;
    }

    .exam-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 22px;
      margin: 0 auto 14px;
      backdrop-filter: blur(8px);
      position: relative;
    }

    .exam-card h3 {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
      position: relative;
    }

    .exam-card p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 18px;
      line-height: 1.5;
      position: relative;
    }

    .exam-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      padding: 0 26px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      background: var(--accent);
      color: var(--dark);
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      box-shadow: 0 8px 22px rgba(231, 168, 59, 0.35);
      width: 100%;
    }

    .exam-btn:hover {
      background: #d99825;
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(231, 168, 59, 0.45);
    }

    .exam-btn:active { transform: scale(0.98); }

    /* Locked exam state */
    .exam-card.locked {
      background: linear-gradient(135deg, #e8eeea 0%, #d9e4dd 100%);
      color: var(--muted);
    }

    .exam-card.locked .exam-icon {
      background: rgba(104, 117, 111, 0.15);
      color: var(--muted);
    }

    .exam-card.locked h3 { color: var(--muted); }
    .exam-card.locked p { color: var(--muted); opacity: 0.85; }

    .exam-card.locked .exam-btn {
      background: rgba(104, 117, 111, 0.2);
      color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Exam passed state */
    .exam-card.passed {
      background: linear-gradient(135deg, #0f4d38 0%, #08321f 100%);
    }

    .exam-card.passed .exam-icon {
      background: rgba(231, 168, 59, 0.25);
      color: var(--accent);
    }

    /* ---- Not found ---- */
    .not-found {
      text-align: center;
      padding: 80px 20px;
    }

    .not-found .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--soft);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }

    .not-found h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .not-found p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* ---- Desktop polish ---- */
    @media (min-width: 901px) {
      body { padding-bottom: 0; }
      .module-page {
        max-width: 720px;
        padding-top: 40px;
        padding-bottom: 60px;
      }
    }
  </style>
</head>

<body>

  <main class="container module-page" id="modulePage">
    <div id="contentMount"></div>
  </main>

  <div id="tabbar"></div>

  <script src="/data.js"></script>
  <script src="/storage.js"></script>
  <script src="/app.js"></script>

  <script>
    /* ============================================================
       MODULE PAGE
       ============================================================ */
    (function initModule() {
      const params = new URLSearchParams(window.location.search);
      const moduleId = params.get("id");
      const lang = STORAGE.getLanguage();
      const isHa = lang === "ha";
      const mount = document.getElementById("contentMount");
      const page = document.getElementById("modulePage");

      /* ---- Not found ---- */
      if (!moduleId) {
        renderNotFound();
        return;
      }

      const mod = DATA.modules.find((m) => m.id === moduleId);
      if (!mod) {
        renderNotFound();
        return;
      }

      /* ---- Page title ---- */
      document.title = (isHa ? mod.title_ha : mod.title_en) + " — Fasahar Al'umma";

      /* ---- Render ---- */
      const progress = STORAGE.getModuleProgress(mod.id);
      const examPassed = STORAGE.isExamPassed(mod.id);
      const allLessonsDone = progress.percent === 100;

      /* Hero */
      const heroHtml = `
        <div class="top-bar">
          <a href="/home.html" class="back-btn" aria-label="${isHa ? "Koma" : "Back"}">
            <i class="fa-solid fa-chevron-left"></i>
          </a>
          <div class="top-bar-title">${isHa ? "Darasi" : "Module"}</div>
        </div>

        <div class="module-hero">
          <div class="module-hero-icon">${APP.icon(iconKeyFor(mod.id))}</div>
          <div class="module-hero-body">
            <div class="module-hero-title">${isHa ? mod.title_ha : mod.title_en}</div>
            <div class="module-hero-sub">${isHa ? mod.title_en : mod.title_ha}</div>
            <div class="module-hero-desc">${isHa ? mod.desc_ha : mod.desc_en}</div>
            <div class="module-hero-progress">
              <div class="bar"><div class="bar-fill" style="width:${progress.percent}%"></div></div>
              <div class="bar-label">${progress.completed} / ${progress.total} · ${progress.percent}%</div>
            </div>
          </div>
        </div>
      `;

      /* Lessons */
      const lessonsHtml = mod.lessons.map((lesson, idx) => {
        const isComplete = STORAGE.isLessonComplete(lesson.id);
        const isUnlocked = STORAGE.isLessonUnlocked(mod.id, lesson.id);

        let stateClass = "locked";
        let statusIcon = '<i class="fa-solid fa-lock"></i>';
        let numContent = '<i class="fa-solid fa-lock" style="font-size:11px"></i>';
        let subText = isHa ? "A kulle" : "Locked";

        if (isComplete) {
          stateClass = "completed";
          statusIcon = '<i class="fa-solid fa-circle-check"></i>';
          numContent = idx + 1;
          subText = isHa ? "An kammala" : "Completed";
        } else if (isUnlocked) {
          stateClass = "unlocked";
          statusIcon = '<i class="fa-solid fa-chevron-right"></i>';
          numContent = idx + 1;
          subText = isHa ? "Fara koyo" : "Start learning";
        }

        const title = isHa ? lesson.title_ha : lesson.title_en;
        const href = stateClass === "locked"
          ? "#"
          : `/lesson.html?module=${mod.id}&lesson=${lesson.id}`;

        return `
          <a href="${href}" class="lesson-row ${stateClass}" ${stateClass === "locked" ? 'aria-disabled="true"' : ""}>
            <div class="lesson-num">${numContent}</div>
            <div class="lesson-body">
              <div class="lesson-title">${title}</div>
              <div class="lesson-sub">${subText}</div>
            </div>
            <div class="lesson-status">${statusIcon}</div>
          </a>
        `;
      }).join("");

      const lessonsHeadHtml = `
        <div class="lessons-head">
          <h3>${isHa ? "Darussa" : "Lessons"}</h3>
          <span>${progress.completed} / ${progress.total}</span>
        </div>
      `;

      /* Exam card */
      let examClass = "exam-card";
      let examIcon = "fa-solid fa-trophy";
      let examTitle, examDesc, examBtnHtml;

      if (examPassed) {
        examClass += " passed";
        examTitle = isHa ? "Ka ci jarrabawar!" : "You passed!";
        examDesc = isHa
          ? "Ka kammala wannan module. Madalla!"
          : "You completed this module. Well done!";
        examBtnHtml = `
          <a href="/certificate.html?module=${mod.id}" class="exam-btn">
            <i class="fa-solid fa-award"></i>
            ${isHa ? "Duba Takardar Shaida" : "View Certificate"}
          </a>
        `;
      } else if (allLessonsDone) {
        examTitle = isHa ? "Yi Jarrabawar Module" : "Take Module Exam";
        examDesc = isHa
          ? "Ka kammala duk darussa. Yanzu za ka iya yin jarrabawa."
          : "You've finished all lessons. Time for the exam.";
        examBtnHtml = `
          <a href="/exam.html?module=${mod.id}" class="exam-btn">
            <i class="fa-solid fa-pen-to-square"></i>
            ${isHa ? "Fara Jarrabawa" : "Start Exam"}
          </a>
        `;
      } else {
        examClass += " locked";
        examIcon = "fa-solid fa-lock";
        examTitle = isHa ? "Jarrabawar Module" : "Module Exam";
        examDesc = isHa
          ? "Kammala duk darussa don buɗe jarrabawa."
          : "Complete all lessons to unlock the exam.";
        examBtnHtml = `
          <button class="exam-btn" disabled>
            <i class="fa-solid fa-lock"></i>
            ${isHa ? "A kulle" : "Locked"}
          </button>
        `;
      }

      const examHtml = `
        <div class="${examClass}">
          <div class="exam-icon"><i class="${examIcon}"></i></div>
          <h3>${examTitle}</h3>
          <p>${examDesc}</p>
          ${examBtnHtml}
        </div>
      `;

      /* Mount everything */
      mount.innerHTML = heroHtml + lessonsHeadHtml +
        '<div class="lessons-list">' + lessonsHtml + '</div>' +
        examHtml;

      /* Fade in */
      requestAnimationFrame(() => page.classList.add("visible"));

      /* Sound on lesson tap (only if unlocked) */
      document.querySelectorAll(".lesson-row.unlocked, .lesson-row.completed").forEach((row) => {
        row.addEventListener("click", () => APP.playSound("tap"));
      });

      /* ---- Helpers ---- */
      function iconKeyFor(id) {
        const map = {
          "phone-internet": "phone",
          "email-work": "email",
          "whatsapp-social": "chat",
          "digital-safety": "safety",
          "ai-basics": "ai",
          "digital-business": "business"
        };
        return map[id] || "modules";
      }

      function renderNotFound() {
        document.title = (isHa ? "Ba a samu ba" : "Not found") + " — Fasahar Al'umma";
        mount.innerHTML = `
          <div class="not-found">
            <div class="icon"><i class="fa-solid fa-circle-question"></i></div>
            <h2>${isHa ? "Ba a samu ba" : "Not found"}</h2>
            <p>${isHa ? "Wannan module ɗin ba ya nan." : "This module doesn't exist."}</p>
            <a href="/home.html" class="btn btn-primary" style="display:inline-flex;min-height:52px;padding:0 24px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;font-weight:700;align-items:center;gap:8px;">
              <i class="fa-solid fa-house"></i>
              ${isHa ? "Koma Gida" : "Back home"}
            </a>
          </div>
        `;
        requestAnimationFrame(() => page.classList.add("visible"));
      }
    })();
  </script>

</body>
</html>
